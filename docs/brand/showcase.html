<!doctype html>
<!-- Source for docs/brand/showcase.png; render at 1600x960 after refreshing docs/screenshots. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 960px; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 20% 0%, #23221f 0%, #111110 55%, #0b0b0a 100%); position: relative; }
  .shot { position: absolute; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 8px 24px rgba(0, 0, 0, 0.35); background: #111110; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .bar { height: 30px; background: #1b1b19; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-bottom: 1px solid #2b2a29; }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3937; }
  .back { right: 70px; top: 70px; width: 1020px; height: 700px; }
  .back img { height: calc(100% - 30px); }
  .front { left: 70px; top: 250px; width: 700px; height: 640px; border-color: rgba(0, 0, 0, 0.15); }
  .front .bar { background: #dddbd5; border-bottom-color: #ceccc7; }
  .front .bar i { background: #b7b5b0; }
  .front img { height: calc(100% - 30px); }
</style>
</head>
<body>
<div class="shot back"><div class="bar"><i></i><i></i><i></i></div><img src="../screenshots/dashboard.png" alt=""></div>
<div class="shot front"><div class="bar"><i></i><i></i><i></i></div><img src="../screenshots/status-light.png" alt=""></div>
</body>
</html>
