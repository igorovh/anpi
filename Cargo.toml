[package]
name = "anpi"
version = "0.2.0"
description = "Lightweight uptime monitor with a status page"
license = "MIT"
repository = "https://github.com/igorovh/anpi"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "form", "typed-header"] }
base64 = "0.23.1"
bytes = "1.12.1"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", features = ["sink"] }
hex = "0.4.3"
hickory-resolver = "0.26.3"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
mime_guess = "2.0.5"
rand = "0.10.3"
regex = "1.13.1"
rust-embed = "8.13.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_path = "0.7.2"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
surge-ping = "0.9.1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "set-header", "compression-gzip", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# Dependencies are optimised once; the anpi crate itself stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
