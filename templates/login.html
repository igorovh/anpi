{% extends "base.html" %}
{% block content %}
<section class="auth fade">
  <h1>Sign in</h1>
  {% if let Some(e) = error %}<p class="error" role="alert">{{ e }}</p>{% endif %}
  {% if sso %}
  <p class="muted">This instance uses single sign-on.</p>
  <a class="btn primary wide" href="/auth/oidc/login?next={{ next|urlencode }}">Continue with SSO</a>
  {% else %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username<input name="username" value="{{ username }}" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn primary wide">Sign in</button>
  </form>
  {% endif %}
</section>
{% endblock %}
