name: Docker image

# Rebuilds the image for an existing release from its published binaries, e.g. after a failed push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.1
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            name="anpi-$TAG-${pair#*:}-unknown-linux-musl"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name.tar.gz*"
            sha256sum -c "$name.tar.gz.sha256"
            mkdir -p "docker-bin/$arch"
            tar xzf "$name.tar.gz" -O "$name/anpi" > "docker-bin/$arch/anpi"
            chmod +x "docker-bin/$arch/anpi"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
