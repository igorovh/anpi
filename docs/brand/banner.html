<!doctype html>
<!-- Source for docs/brand/banner.png; render at 1280x320. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Plex; font-weight: 400; src: url(../../static/fonts/plex-400-latin.woff2) format("woff2"); }
  @font-face { font-family: Plex; font-weight: 500; src: url(../../static/fonts/plex-500-latin.woff2) format("woff2"); }
  :root { --bg: #0a0a0a; --ink: #e6e4dd; --muted: #85847f; --up: #8fb07f; --down: #d0705f; --pending: #d1aa5c; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 320px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: Plex, sans-serif;
    display: flex; align-items: center; justify-content: space-between; padding: 0 72px; }
  .title { display: flex; align-items: center; gap: 26px; }
  .mark { font-family: "Courier New", monospace; font-weight: 700; font-size: 58px; letter-spacing: -0.04em; text-box: trim-both cap alphabetic; }
  .word { font-size: 104px; font-weight: 500; letter-spacing: -0.04em; line-height: 1; text-box: trim-both cap alphabetic; }
  .tag { margin-top: 26px; font-size: 22px; color: var(--muted); }
  .bars { margin-top: 22px; display: flex; gap: 4px; }
  .bars i { width: 14px; height: 14px; border-radius: 2px; background: var(--up); }
  .bars i.d { background: var(--down); }
  .bars i.p { background: var(--pending); }
  .status { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 500; color: var(--up);
    border: 1px solid var(--up); padding: 11px 20px; border-radius: 3px; }
  .status b { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
  .status span { color: var(--ink); }
</style>
</head>
<body>
<div>
  <div class="title"><span class="mark">&gt;^&lt;</span><span class="word">anpi</span></div>
  <div class="tag">lightweight uptime monitoring, written in Rust</div>
  <div class="bars" id="bars"></div>
</div>
<div class="status"><b></b><span>All systems operational</span></div>
<script>
  var bars = document.getElementById("bars");
  for (var i = 0; i < 30; i++) {
    var e = document.createElement("i");
    if (i === 11) e.className = "d"; else if (i === 23) e.className = "p";
    bars.appendChild(e);
  }
</script>
</body>
</html>
